<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluentGlass AI Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f9;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .liquid-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .liquid-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .liquid-btn:hover::after {
            left: 100%;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
        }

        .active-word {
            background: #6366f1;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            padding: 0 4px;
        }

        @keyframes pulse-bg {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.4;
            }

            100% {
                transform: scale(1);
                opacity: 0.3;
            }
        }

        .bg-glow {
            animation: pulse-bg 8s infinite ease-in-out;
        }
    </style>
</head>

<body class="min-h-screen relative overflow-x-hidden">
    <!-- Background Decor -->
    <div class="fixed -top-40 -left-40 w-[600px] h-[600px] bg-blue-200/40 rounded-full blur-[120px] -z-10 bg-glow">
    </div>
    <div class="fixed -bottom-40 -right-40 w-[600px] h-[600px] bg-purple-200/40 rounded-full blur-[120px] -z-10 bg-glow"
        style="animation-delay: 2s;"></div>

    <div class="max-w-6xl mx-auto px-4 py-8 md:py-12">
        <!-- Header -->
        <header class="mb-10 text-center">
            <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/50 border border-white/40 text-indigo-600 text-[10px] font-black uppercase tracking-[0.2em] mb-4 shadow-sm">
                <i class="fas fa-sparkles"></i> HTML5 Smart Reading
            </div>
            <h1 class="text-5xl font-black text-slate-900 mb-2 tracking-tight">Fluent<span
                    class="text-indigo-600">Glass</span></h1>
            <p class="text-slate-500 font-medium">段落獨立朗讀與 AI 單字釋義</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Left: Input -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card rounded-[2rem] p-6 shadow-2xl">
                    <textarea id="inputText"
                        class="w-full h-80 p-5 bg-white/30 border border-white/40 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all resize-none text-slate-700 text-lg leading-snug placeholder:text-slate-400"
                        placeholder="在此貼上英文內容..."></textarea>

                    <div class="flex gap-3 mt-6">
                        <button onclick="handleProcessText()"
                            class="liquid-btn flex-1 py-3 bg-indigo-500/80 backdrop-blur-md border border-white/20 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-font"></i> 更新內容
                        </button>
                        <button onclick="clearAll()"
                            class="liquid-btn px-6 py-3 bg-white/40 backdrop-blur-md border border-white/30 text-slate-600 rounded-2xl shadow-md">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Reading Area -->
            <div class="lg:col-span-7">
                <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl min-h-[600px] flex flex-col">
                    <!-- Controls -->
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-6 border-b border-white/50">
                        <div class="flex items-center gap-4">
                            <div class="p-3 rounded-2xl bg-white/50 shadow-inner"><i
                                    class="fas fa-volume-up text-indigo-500 text-xl"></i></div>
                            <div class="space-y-1">
                                <div
                                    class="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <i class="fas fa-sliders-h"></i> 語速: <span id="rateVal">1.0</span>x
                                </div>
                                <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1.0"
                                    class="w-32 h-1.5 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                            </div>
                        </div>

                        <button id="fullPlayBtn" onclick="toggleFullRead()"
                            class="liquid-btn px-8 py-3 bg-emerald-500/80 backdrop-blur-md border border-white/20 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 min-w-[140px]">
                            <i class="fas fa-play"></i> 播放全文
                        </button>
                    </div>

                    <!-- Paragraph Content -->
                    <div id="readingContent" class="flex-1 space-y-6 overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Content will be injected here -->
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 py-20">
                            <i class="fas fa-circle-notch fa-spin text-3xl mb-4 opacity-20"></i>
                            <p class="font-medium">等待輸入內容...</p>
                        </div>
                    </div>

                    <!-- Word Info Card -->
                    <div id="wordInfoCard" class="mt-6 hidden animate-fade-in">
                        <div
                            class="relative p-6 rounded-3xl bg-white/80 border border-indigo-100 shadow-2xl backdrop-blur-md">
                            <button onclick="closeWordCard()"
                                class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors">
                                <i class="fas fa-times"></i>
                            </button>
                            <div class="flex items-center gap-3 mb-3">
                                <h4 id="targetWord" class="text-2xl font-black text-indigo-600">Word</h4>
                                <button onclick="speakTargetWord()"
                                    class="p-2 rounded-xl bg-indigo-50 text-indigo-500 hover:bg-indigo-100 transition-colors">
                                    <i class="fas fa-volume-up"></i>
                                </button>
                            </div>
                            <div id="wordDetails"
                                class="text-slate-600 font-medium leading-relaxed whitespace-pre-wrap"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // 執行環境提供
        const synth = window.speechSynthesis;
        let isReadingAll = false;
        let currentUtterance = null;

        // UI Elements
        const inputText = document.getElementById('inputText');
        const readingContent = document.getElementById('readingContent');
        const rateRange = document.getElementById('rateRange');
        const rateVal = document.getElementById('rateVal');
        const fullPlayBtn = document.getElementById('fullPlayBtn');
        const wordInfoCard = document.getElementById('wordInfoCard');
        const targetWordText = document.getElementById('targetWord');
        const wordDetails = document.getElementById('wordDetails');

        // Init
        window.onload = () => {
            const demo = "The key component for connecting cables to devices is the RJ-45 connector.\n\nIt has 8 metal pins, which can be either bifurcated or trifurcated in design. Modern NICs support auto-sensing and full-duplex transmission.";
            inputText.value = demo;
            handleProcessText();
        };

        rateRange.oninput = () => { rateVal.innerText = rateRange.value; };

        function handleProcessText() {
            const text = inputText.value;
            if (!text.trim()) return;

            const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
            readingContent.innerHTML = '';

            paragraphs.forEach((pText, pIdx) => {
                const words = pText.split(/(\s+)/).filter(e => e.length > 0);

                const pCard = document.createElement('div');
                pCard.className = 'p-6 rounded-3xl bg-white/20 border border-white/30 hover:bg-white/40 transition-all relative group';

                // Paragraph Play Button
                const playBtn = document.createElement('button');
                playBtn.className = 'absolute top-4 right-4 p-2 rounded-xl bg-white/40 border border-white/50 text-indigo-600 opacity-0 group-hover:opacity-100 transition-all hover:bg-white/60 active:scale-90 shadow-sm';
                playBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
                playBtn.onclick = () => speakParagraph(pText);
                pCard.appendChild(playBtn);

                const wordContainer = document.createElement('div');
                wordContainer.className = 'flex flex-wrap items-baseline text-slate-800 leading-[1.4] pr-8';

                words.forEach((word, wIdx) => {
                    const span = document.createElement('span');
                    span.innerText = word;
                    span.className = 'px-[2px] py-[1px] rounded-md cursor-pointer transition-all duration-150 text-xl font-medium hover:bg-indigo-500/10 hover:text-indigo-600';

                    if (word.trim()) {
                        span.onclick = () => speakWord(word, span);
                        span.ondblclick = () => getWordDetails(word);
                    } else {
                        span.className = 'w-1';
                    }

                    wordContainer.appendChild(span);
                });

                pCard.appendChild(wordContainer);
                readingContent.appendChild(pCard);
            });
        }

        function speakWord(word, element) {
            synth.cancel();
            const clean = word.replace(/[^a-zA-Z0-9]/g, '');
            if (!clean) return;

            const utter = new SpeechSynthesisUtterance(clean);
            utter.lang = 'en-US';
            utter.rate = parseFloat(rateRange.value);

            utter.onstart = () => element.classList.add('active-word');
            utter.onend = () => element.classList.remove('active-word');

            synth.speak(utter);
        }

        function speakParagraph(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = parseFloat(rateRange.value);
            synth.speak(utter);
        }

        function toggleFullRead() {
            if (synth.speaking) {
                synth.cancel();
                isReadingAll = false;
                updateFullBtn();
                return;
            }

            const utter = new SpeechSynthesisUtterance(inputText.value);
            utter.lang = 'en-US';
            utter.rate = parseFloat(rateRange.value);

            utter.onstart = () => { isReadingAll = true; updateFullBtn(); };
            utter.onend = () => { isReadingAll = false; updateFullBtn(); };

            synth.speak(utter);
        }

        function updateFullBtn() {
            fullPlayBtn.innerHTML = isReadingAll
                ? '<i class="fas fa-square"></i> 停止播放'
                : '<i class="fas fa-play"></i> 播放全文';
            fullPlayBtn.className = isReadingAll
                ? 'liquid-btn px-8 py-3 bg-red-500/80 backdrop-blur-md border border-white/20 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 min-w-[140px]'
                : 'liquid-btn px-8 py-3 bg-emerald-500/80 backdrop-blur-md border border-white/20 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 min-w-[140px]';
        }

        async function getWordDetails(word) {
            const clean = word.replace(/[^a-zA-Z]/g, '');
            if (!clean) return;

            wordInfoCard.classList.remove('hidden');
            targetWordText.innerText = clean;
            wordDetails.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>AI 正在查詢中...';

            try {
                const prompt = `Traditional Chinese definition and example for: "${clean}"`;
                const res = await callGemini(prompt, "Dictionary mode. Keep it concise.");
                wordDetails.innerText = res;

                // TTS call for dictionary
                speakWithGeminiAI(`The word is ${clean}. ${res.split('\n')[0]}`);
            } catch (e) {
                wordDetails.innerText = "查詢失敗，請稍後再試。";
            }
        }

        async function callGemini(prompt, systemPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function speakWithGeminiAI(text) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                        }
                    })
                });
                const data = await response.json();
                const pcmData = data.candidates[0].content.parts[0].inlineData.data;
                playPCM(pcmData);
            } catch (e) { console.error(e); }
        }

        function playPCM(base64) {
            const buffer = Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + buffer.byteLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, 24000, true);
            view.setUint32(28, 48000, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, buffer.byteLength, true);
            const blob = new Blob([wavHeader, buffer], { type: 'audio/wav' });
            new Audio(URL.createObjectURL(blob)).play();
        }

        function speakTargetWord() {
            speakWord(targetWordText.innerText, targetWordText);
        }

        function closeWordCard() { wordInfoCard.classList.add('hidden'); }

        function clearAll() {
            inputText.value = '';
            readingContent.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-slate-400 py-20"><p>等待輸入內容...</p></div>';
            closeWordCard();
            synth.cancel();
        }
    </script>
</body>

</html>
